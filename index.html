<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamForge | Modular Exam Prep</title>
  
  <!-- Core Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/styles.css">
  
  <!-- Application Logic -->
  <script type="module" src="./js/core/app.js"></script>
  
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body x-data="app" class="antialiased selection:bg-primary-500/30" :class="darkMode ? 'bg-dark-900 text-gray-100' : 'bg-gray-50 text-gray-900'" x-cloak>

  <!-- Navigation -->
  <nav class="fixed top-0 w-full z-50 transition-all duration-300 border-b" 
       :class="scrolled ? (darkMode ? 'bg-dark-900/90 backdrop-blur-md border-white/10' : 'bg-white/90 backdrop-blur-md border-gray-200') : 'bg-transparent border-transparent'">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" @click="currentSection='home'">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center shadow-lg shadow-primary-500/20">
          <i class="fas fa-bolt text-white text-sm"></i>
        </div>
        <span class="text-xl font-black bg-gradient-to-r from-primary-400 to-accent-400 bg-clip-text text-transparent">ExamForge</span>
      </div>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-6">
        <template x-for="link in navLinks" :key="link.id">
          <button @click="currentSection = link.id" 
                  class="text-sm font-medium transition-colors hover:text-primary-400"
                  :class="currentSection === link.id ? 'text-primary-400' : (darkMode ? 'text-gray-400' : 'text-gray-600')"
                  x-text="link.label"></button>
        </template>
        <div class="w-px h-4 bg-gray-700/50"></div>
        <button @click="toggleDark()" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/5 transition-colors">
          <i class="fas" :class="darkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-gray-600'"></i>
        </button>
      </div>
      
      <!-- Mobile Menu Toggle -->
      <button @click="mobileMenu = !mobileMenu" class="md:hidden p-2">
        <i class="fas fa-bars text-xl"></i>
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <header x-show="currentSection === 'home'" class="relative min-h-screen flex items-center justify-center overflow-hidden pt-16">
    <div class="absolute inset-0 z-0 opacity-40">
      <canvas id="hero-canvas" class="w-full h-full"></canvas>
    </div>
    <div class="relative z-10 text-center max-w-4xl px-4">
      <h1 class="text-5xl md:text-7xl font-black mb-6 tracking-tight">Master Your Exams with <span class="bg-gradient-to-r from-primary-400 to-accent-400 bg-clip-text text-transparent">Forge Precision</span></h1>
      <p class="text-xl md:text-2xl text-gray-400 mb-10 leading-relaxed">Interactive modules for Chemistry, Biology, French, and more. Built for the modern student.</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-12">
        <template x-for="card in subjectCards" :key="card.id">
          <div @click="currentSection = card.id" 
               class="group p-6 rounded-3xl border transition-all duration-500 cursor-pointer hover:-translate-y-2"
               :class="darkMode ? 'bg-dark-800/50 border-white/10 hover:border-primary-500/50' : 'bg-white border-gray-200 shadow-xl hover:border-primary-400'">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl mb-4 transition-transform group-hover:scale-110" :class="card.gradient">
              <i :class="card.icon"></i>
            </div>
            <h3 class="text-xl font-bold mb-2" x-text="card.title"></h3>
            <p class="text-sm text-gray-500" x-text="card.desc"></p>
          </div>
        </template>
      </div>
    </div>
  </header>

  <!-- Subject Content (Modular) -->
  <main class="pt-24 pb-20">
    
    <!-- Religion Section -->
    <section x-show="currentSection === 'religion'" class="max-w-6xl mx-auto px-4">
       <h2 class="text-4xl font-black mb-8">Religious Education</h2>
       <!-- Religion content here using religion.* data -->
       <div class="grid gap-8">
         <template x-for="event in religion.genesis25Events">
           <div class="p-6 rounded-2xl bg-dark-800 border border-white/10">
             <h3 class="text-xl font-bold text-amber-400" x-text="event.title"></h3>
             <p class="text-gray-400 mt-2" x-text="event.desc"></p>
           </div>
         </template>
       </div>
       
       <!-- Quiz -->
       <div class="mt-16" x-data="quizComponent('religion')">
          <h2 class="text-2xl font-bold mb-6">Subject Quiz</h2>
          <template x-for="(q, index) in questions" :key="index">
            <div class="mb-6 p-6 rounded-xl bg-dark-800 border border-white/5">
              <p class="font-bold mb-4" x-text="(index+1) + '. ' + q.question"></p>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <template x-for="(opt, oi) in q.options" :key="oi">
                  <button @click="selectAnswer(index, oi)" 
                          class="p-3 rounded-lg border transition-all text-left"
                          :class="getOptionClass(index, oi)"
                          x-text="opt"></button>
                </template>
              </div>
            </div>
          </template>
          <button @click="checkQuiz" class="px-8 py-3 bg-primary-600 rounded-xl font-bold hover:bg-primary-500 transition-all">Check Answers</button>
       </div>
    </section>

    <!-- Other sections follow a similar pattern... -->
    
  </main>

  <!-- Search Modal -->
  <div x-show="showSearch" class="fixed inset-0 z-[100] flex items-start justify-center pt-20 px-4" x-transition>
    <div class="absolute inset-0 bg-dark-900/80 backdrop-blur-sm" @click="showSearch=false"></div>
    <div class="relative w-full max-w-2xl rounded-2xl bg-dark-800 border border-white/10 shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-white/10 flex items-center gap-3">
        <i class="fas fa-search text-gray-500"></i>
        <input type="text" x-model="searchQuery" @input="performSearch" placeholder="Search topics, vocabulary, or subjects..." 
               class="bg-transparent border-none outline-none w-full text-lg text-white" x-ref="searchInput">
      </div>
      <div class="max-h-96 overflow-y-auto p-2">
        <template x-for="result in searchResults">
          <div @click="goToResult(result)" class="p-4 rounded-xl hover:bg-white/5 cursor-pointer flex justify-between items-center group">
            <div>
              <p class="text-xs text-primary-400 font-bold uppercase tracking-wider" x-text="result.subject"></p>
              <p class="text-gray-200" x-text="result.text"></p>
            </div>
            <i class="fas fa-chevron-right text-gray-600 group-hover:text-primary-400 transition-colors"></i>
          </div>
        </template>
        <div x-show="searchResults.length === 0 && searchQuery.length >= 2" class="p-8 text-center text-gray-500">
          No results found for "<span x-text="searchQuery"></span>"
        </div>
      </div>
    </div>
  </div>

</body>
</html>
