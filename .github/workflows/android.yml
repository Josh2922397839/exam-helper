name: Android

# Builds and tests the Android app on a clean machine whenever it, or the website files it bundles, change.
on:
  pull_request:
    paths: ["android/**", "assets/img/**", "supabase/**", "tools/android/**", ".github/workflows/android.yml"]
  push:
    branches: [master]
    paths: ["android/**", "assets/img/**", "supabase/**", "tools/android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Rules, app tests, lint and release bundle
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:bundleRelease --console=plain
      - name: Server-side checks (shared billing logic, zing-ai input rules)
        run: node --experimental-strip-types tools/android/test-play-shared.mjs
      - name: Database migration, rollback and re-apply on PostgreSQL
        run: PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" tools/android/test-migration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/core/build/reports
          retention-days: 14
